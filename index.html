<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DL Logo Accurate Reconstruction</title>

<style>
  body {
    margin: 0;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .logo {
    width: 90vw;
    max-width: 520px;
  }

  svg {
    width: 100%;
    height: auto;
    shape-rendering: geometricPrecision;
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer ring -->
  <circle cx="300" cy="300" r="270" fill="#1f3f66"/>

  <!-- Inner white -->
  <circle cx="300" cy="300" r="250" fill="#ffffff"/>

  <!-- Left inner arc (thin white curve) -->
  <path d="
    M300 50
    A250 250 0 0 0 100 300
  " fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- Red L (matched proportions) -->
  <path d="
    M165 140
    L165 455
    L285 455
    L285 375
    L215 375
    L215 210
    L165 140
    Z"
    fill="#7a2b24"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="miter"
  />

  <!-- Top black slab (corrected angle + length) -->
  <path d="
    M165 140
    L335 140
    L495 265
    L325 265
    Z"
    fill="#2a2a2a"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="miter"
  />

  <!-- Blue D / arrow frame (corrected geometry) -->
  <path d="
    M230 210
    L350 210
    L520 350
    L520 450
    L350 580
    L350 470
    L445 400
    L350 330
    L230 330
    Z"
    fill="#2f5483"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="miter"
  />

  <!-- Inner dark arrow -->
  <path d="
    M300 330
    L415 395
    L300 460
    Z"
    fill="#222222"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="miter"
  />

</svg>
</div>

</body>
</html>

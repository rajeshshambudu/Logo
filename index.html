<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DL Logo - SVG Reconstruction</title>

<style>
  body {
    margin: 0;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .logo {
    width: 90vw;
    max-width: 520px;
  }

  svg {
    width: 100%;
    height: auto;
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer blue ring -->
  <circle cx="300" cy="300" r="270" fill="#1f3f66"/>

  <!-- Inner white circle -->
  <circle cx="300" cy="300" r="250" fill="#ffffff"/>

  <!-- Left curved cut (arc effect) -->
  <path d="
    M300 30
    A270 270 0 0 0 80 300
    A250 250 0 0 1 300 50
    Z" fill="#ffffff"/>

  <!-- Red L shape -->
  <path d="
    M150 140
    L150 450
    L290 450
    L290 370
    L210 370
    L210 140
    Z"
    fill="#7a2b24"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Top dark slab -->
  <path d="
    M150 140
    L330 140
    L500 260
    L320 260
    Z"
    fill="#2a2a2a"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Blue angular D shape -->
  <path d="
    M220 210
    L340 210
    L540 350
    L340 520
    L340 420
    L440 350
    L340 290
    L220 290
    Z"
    fill="#2f5483"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Inner dark play arrow -->
  <path d="
    M300 300
    L420 350
    L300 420
    Z"
    fill="#222222"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
  />

</svg>
</div>

</body>
</html>

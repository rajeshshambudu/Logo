<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL Logo SVG Reconstruction</title>

<style>
  body {
    margin: 0;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .logo {
    width: 90vw;
    max-width: 520px;
  }

  svg {
    width: 100%;
    height: auto;
    shape-rendering: geometricPrecision;
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer Blue Ring -->
  <circle cx="300" cy="300" r="270" fill="#1f3f66"/>

  <!-- Inner White Circle -->
  <circle cx="300" cy="300" r="250" fill="#ffffff"/>

  <!-- Thin Inner Arc -->
  <path d="
    M300 55
    A245 245 0 0 0 105 300
  " fill="none" stroke="#ffffff" stroke-width="10"/>

  <!-- Red L Shape (precise angles) -->
  <path d="
    M165 145
    L165 455
    L285 455
    L285 375
    L215 375
    L215 220
    L165 145
    Z"
    fill="#7a2b24"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linejoin="miter"
  />

  <!-- Top Dark Slab -->
  <path d="
    M165 145
    L340 145
    L505 270
    L330 270
    Z"
    fill="#2b2b2b"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linejoin="miter"
  />

  <!-- Blue D / Arrow Frame -->
  <path d="
    M225 220
    L350 220
    L530 360
    L530 460
    L350 590
    L350 470
    L455 400
    L350 330
    L225 330
    Z"
    fill="#2f5483"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linejoin="miter"
  />

  <!-- Inner Black Arrow -->
  <path d="
    M300 330
    L420 395
    L300 460
    Z"
    fill="#222222"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linejoin="miter"
  />

</svg>
</div>

</body>
</html>

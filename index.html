<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Refined Logo SVG</title>

  <style>
    :root {
      --blue: #2f5b8f;
      --dark: #1f1f1f;
      --red: #7a2b24;
      --ring: #1f3f66;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .logo-container {
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 1/1;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* Subtle premium polish */
    .shadow {
      filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.12));
    }

    .gloss {
      opacity: 0.08;
    }

  </style>
</head>
<body>

<div class="logo-container">
  <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

    <!-- Outer Circular Ring -->
    <circle cx="250" cy="250" r="220"
      fill="none"
      stroke="url(#ringGradient)"
      stroke-width="24"
      class="shadow"
    />

    <!-- Subtle Inner Stroke -->
    <circle cx="250" cy="250" r="200"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.6"
      stroke-width="3"
    />

    <!-- Abstract L Shape -->
    <path
      d="M140 130 L140 370 L260 370 L260 320 L190 320 L190 130 Z"
      fill="url(#redGradient)"
      class="shadow"
    />

    <!-- Blue Arrow Frame -->
    <path
      d="M160 150 
         L300 150 
         L420 250 
         L300 350 
         L300 310 
         L370 250 
         L300 190 
         L220 190 
         Z"
      fill="url(#blueGradient)"
      class="shadow"
    />

    <!-- Inner Dark Arrow -->
    <path
      d="M260 230 L340 250 L260 290 Z"
      fill="url(#darkGradient)"
    />

    <!-- Top Dark Edge -->
    <path
      d="M140 130 L300 130 L380 190 L300 190 Z"
      fill="url(#darkGradient)"
      opacity="0.9"
    />

    <!-- Gloss Highlight -->
    <ellipse cx="220" cy="160" rx="140" ry="60"
      fill="#ffffff"
      class="gloss"
    />

    <!-- Gradients -->
    <defs>

      <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3d6fa8"/>
        <stop offset="100%" stop-color="#244c78"/>
      </linearGradient>

      <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8e332c"/>
        <stop offset="100%" stop-color="#6a221d"/>
      </linearGradient>

      <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2e2e2e"/>
        <stop offset="100%" stop-color="#111111"/>
      </linearGradient>

      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2a4f7c"/>
        <stop offset="100%" stop-color="#163454"/>
      </linearGradient>

    </defs>

  </svg>
</div>

</body>
</html>

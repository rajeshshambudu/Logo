<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Ladders</title>

<style>
  :root {
    --bg:#0f172a;
    --card:#1e293b;
    --text:#fff;
    --muted:#cbd5e1;
    --accent:#f59e0b;
  }

  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
  }

  .logo {
    width:90vw;
    max-width:500px;
  }

  svg {
    width:100%;
    height:auto;
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- OUTER BLUE RING -->
  <circle cx="300" cy="300" r="270" fill="#1f3f66"/>

  <!-- INNER WHITE -->
  <circle cx="300" cy="300" r="248" fill="#ffffff"/>

  <!-- LEFT ARC CUT -->
  <path d="
    M300 52
    A248 248 0 0 0 102 300
  " fill="none" stroke="#ffffff" stroke-width="10"/>

  <!-- RED L SHAPE -->
  <path d="
    M168 138
    L168 452
    L288 452
    L288 372
    L218 372
    L218 212
    L168 138
    Z"
    fill="#7a2b24"
    stroke="#ffffff"
    stroke-width="7"
  />

  <!-- TOP BLACK SLAB -->
  <path d="
    M168 138
    L340 138
    L498 262
    L326 262
    Z"
    fill="#2a2a2a"
    stroke="#ffffff"
    stroke-width="7"
  />

  <!-- BLUE D SHAPE -->
  <path d="
    M228 212
    L350 212
    L528 350
    L528 448
    L350 580
    L350 468
    L448 400
    L350 332
    L228 332
    Z"
    fill="#2f5483"
    stroke="#ffffff"
    stroke-width="7"
  />

  <!-- INNER BLACK TRIANGLE -->
  <path d="
    M300 330
    L420 395
    L300 458
    Z"
    fill="#222222"
    stroke="#ffffff"
    stroke-width="7"
  />

</svg>
</div>

</body>
</html>

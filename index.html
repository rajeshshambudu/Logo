<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DL Logo Refined</title>

<style>
  :root {
    --blue: #2c4f7a;
    --blue-dark: #1e3a5a;
    --red: #7b2a24;
    --red-dark: #5e1f1a;
    --black: #1a1a1a;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f4;
  }

  .logo {
    width: 90vw;
    max-width: 420px;
  }

  svg {
    width: 100%;
    height: auto;
  }

  .shadow {
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.15));
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="215"
    fill="none"
    stroke="var(--blue)"
    stroke-width="22"
    class="shadow"/>

  <!-- Inner Circle -->
  <circle cx="250" cy="250" r="190"
    fill="#ffffff"/>

  <!-- LEFT L SHAPE -->
  <path d="
    M150 130
    L150 370
    L260 370
    L260 315
    L205 315
    L205 130
    Z"
    fill="url(#redGrad)"
  />

  <!-- TOP DARK SLAB -->
  <path d="
    M150 130
    L300 130
    L370 180
    L220 180
    Z"
    fill="url(#darkGrad)"
  />

  <!-- BLUE D SHAPE (RIGHT FRAME) -->
  <path d="
    M220 180
    L300 180
    L400 250
    L300 320
    L300 280
    L350 250
    L300 220
    L220 220
    Z"
    fill="url(#blueGrad)"
  />

  <!-- INNER PLAY TRIANGLE -->
  <path d="
    M260 215
    L330 250
    L260 285
    Z"
    fill="var(--black)"
  />

  <!-- Gradients -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b6aa3"/>
      <stop offset="100%" stop-color="#244c78"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c332d"/>
      <stop offset="100%" stop-color="#6a221c"/>
    </linearGradient>

    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>

</svg>
</div>

</body>
</html>

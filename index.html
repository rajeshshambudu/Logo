<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL Logo Exact</title>

<style>
  body {
    margin: 0;
    background: #e6e6e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .logo {
    width: 90vw;
    max-width: 500px;
  }

  svg {
    width: 100%;
    height: auto;
  }

  /* Colors (matched visually) */
  .ring { fill: #213f63; }
  .ring-inner { fill: #ffffff; }
  .stroke-white { stroke: #ffffff; stroke-width: 6; }

  .red { fill: #7a2b24; }
  .blue { fill: #2f5483; }
  .dark { fill: #222222; }

</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- OUTER BLUE RING -->
  <circle cx="300" cy="300" r="270" class="ring"/>

  <!-- INNER WHITE BASE -->
  <circle cx="300" cy="300" r="250" class="ring-inner"/>

  <!-- LEFT ARC CUT (to mimic original gap style) -->
  <path d="
    M300 30
    A270 270 0 0 0 80 300
    A250 250 0 0 1 300 50
    Z" fill="#ffffff"/>

  <!-- RED L SHAPE -->
  <path class="red stroke-white" d="
    M140 140
    L140 440
    L280 440
    L280 370
    L200 370
    L200 140
    Z"/>

  <!-- TOP DARK SLANTED BAR -->
  <path class="dark stroke-white" d="
    M140 140
    L310 140
    L470 250
    L300 250
    Z"/>

  <!-- BLUE RIGHT ARROW FRAME -->
  <path class="blue stroke-white" d="
    M200 200
    L320 200
    L520 350
    L320 500
    L320 420
    L420 350
    L320 280
    L200 280
    Z"/>

  <!-- INNER DARK PLAY TRIANGLE -->
  <path class="dark stroke-white" d="
    M300 300
    L400 350
    L300 400
    Z"/>

</svg>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DL Logo Accurate SVG</title>

<style>
  body {
    margin: 0;
    background: #f3f3f3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .logo {
    width: 90vw;
    max-width: 520px;
  }

  svg {
    width: 100%;
    height: auto;
  }
</style>
</head>

<body>

<div class="logo">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer ring -->
  <circle cx="300" cy="300" r="270" fill="#1f3f66"/>

  <!-- Inner white -->
  <circle cx="300" cy="300" r="250" fill="#ffffff"/>

  <!-- Left arc cut (accurate) -->
  <path d="
    M300 30
    A270 270 0 0 0 90 300
    A250 250 0 0 1 300 55
    Z" fill="#ffffff"/>

  <!-- Red L -->
  <path d="
    M160 150
    L160 455
    L285 455
    L285 375
    L215 375
    L215 150
    Z"
    fill="#7a2b24"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- Top dark slab -->
  <path d="
    M160 150
    L335 150
    L500 270
    L325 270
    Z"
    fill="#2b2b2b"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- Blue arrow frame -->
  <path d="
    M215 220
    L345 220
    L530 360
    L345 520
    L345 425
    L445 360
    L345 300
    L215 300
    Z"
    fill="#2f5483"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- Inner play triangle -->
  <path d="
    M300 300
    L410 355
    L300 420
    Z"
    fill="#222222"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linejoin="round"
  />

</svg>
</div>

</body>
</html>
